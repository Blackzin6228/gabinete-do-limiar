plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// O Minecraft 1.21.1 roda em Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Jars de outros mods do pack usados só para compilar (compileOnly: não vão dentro do nosso jar).
// O ferramentas/baixar_libs.sh baixa esta lista do modpack para libs/. Código que usa a API de um deles mora
// só em compat/<mod>/ e é chamado atrás de Compat.Integracao.X.ligada() (o Iris é por reflexão, fora da lista).
def libsDoPack = [
        'curios-neoforge-9.5.1+1.21.1.jar',            // slot de acessório dos artefatos (opcional)
]

dependencies {
    def pastaLibs = "${projectDir}/libs"
    libsDoPack.each { nome ->
        def jar = file("${pastaLibs}/${nome}")
        if (!jar.exists()) {
            throw new GradleException("Falta ${pastaLibs}/${nome}. Rode: bash ferramentas/baixar_libs.sh")
        }
        compileOnly files(jar)
    }

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Os testes não veem o Minecraft; o leitor dos livros em JSON (historia/livros/LeitorLivros) usa o Gson, a mesma versão do jogo.
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

test {
    useJUnitPlatform()
}

// Preenche o neoforge.mods.toml com os valores do gradle.properties.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
