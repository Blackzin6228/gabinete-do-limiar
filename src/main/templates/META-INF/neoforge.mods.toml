modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Nikolas"
description='''
Horror paranormal do CONGUITOS SMP. Os jogadores são agentes do Gabinete do Limiar.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Integrações opcionais (só por reflexão em compat/): o mod abre sem elas.
[[dependencies.${mod_id}]]
    modId="mekanism"
    type="optional"
    versionRange="[10,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="avaritia"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
